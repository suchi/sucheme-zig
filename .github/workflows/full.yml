# The slow tier (docs/plans/0007-test-tiers.md).
#
# ci.yml runs on every commit and leaves out the tests that check a scale
# (a recursion a hundred thousand levels deep, a loop of a million steps). They
# find the faults that grow with the size of the input, and they take most of
# the time of a run. They run here instead: when a pull request is marked ready
# for review, and on request. The table in AGENTS.md lists the commands.
#
# `main` への push では走らせない。マージされるコミットは、PR の先頭のコミットとして
# ここを通っている。ready にしたあとに push したコミットでは、このワークフローは
# 起動しないので、マージの承認を求める前に、先頭のコミットで手動で走らせる
# (AGENTS.md)。`main` への push では ci.yml が走る。private リポジトリでは実行分数が
# 月の枠に計上されるので、同じコミットの検査を重ねない(docs/plans/0015-ci-minutes-reduction.md)。
#
# windows ジョブは、ci.yml が全 push で走らせていた Windows のテストを、ここへ
# 移したものである。Windows でしか起きない不具合は、PR を ready にしたときか、
# 手動で走らせたときに見つかる。tools/check-docs は、このファイルに
# `runs-on: windows-latest` があることと、ci.yml の各 `run:` 行がこのファイルにも
# あることを確かめる。それぞれがどのジョブにあるかまでは見ない(2つのジョブの
# `runs-on` を入れ替える編集は通る)。
#
# dist ジョブは、リリースの成果物の組み立てを試す。`zig build dist` が全ターゲットを
# 作り、tools/release/package.py がアーカイブと SHA256SUMS を作って読み直す。
# リリースのワークフロー(release.yml)は、タグの push でこの2つを同じように走らせる
# (docs/adr/0034-release-shape.md)。組み立ての誤りは、タグを打つ日でなく、ここで
# 見つかる。
#
# slow ジョブと dist ジョブは Linux だけで走らせる。論理は Windows でも同じだからである。
#
# 変更したファイルがすべて `paths-ignore` に一致する PR(文書だけの PR)では、ready に
# しても起動しない(docs/adr/0046-skip-slow-tier-for-docs-only-prs.md)。一覧は、AGENTS.md
# の文書だけの PR の定義(変更ファイルの種類で決める)に合わせ、実行ファイルとテストと
# 検査の結果に影響しない文書だけにする。文書の検査(check-docs など)は、ci.yml が全 PR
# で走らせる。tools/check-docs はこの値を綴りごと固定するので、一覧を変えるときは、
# AGENTS.md の定義と検査を合わせて変える。`workflow_dispatch` はこのキーの外にあるので、
# 手動の起動は一覧に関係なく走ると見ている(公式文書に明記は見つけていない。ADR-0046)。
#
# The Zig version below is a copy; .zigversion is the source of truth.

name: Full

on:
  pull_request:
    types: [ready_for_review]
    paths-ignore: ["docs/**", "**/*.md", ".agents/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slow:
    name: slow tests (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit SHA, not a tag: tags can be moved.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # Why: Zig のキャッシュは、setup-zig ではなくこの step が持つ(上の
      # `use-cache: false`)。setup-zig は、結果にかかわらず毎回の実行の最後に、新しい
      # キーでキャッシュを保存し、復元は検査せずに最新の項目を取る。キャッシュを
      # 展開している途中で中断された実行が、展開しかけのディレクトリを保存し、
      # 以後の実行がそれを復元して失敗し、失敗した実行がまた保存した
      # (docs/adr/0032-ci-zig-cache-saved-only-by-successful-runs.md)。
      #
      # actions/cache は、ジョブが成功し、かつこのキーが無かったときだけ保存する。
      # キーには、キャッシュの中身を決めるものを入れるので、項目の数は少ないままである。
      # キャッシュを捨てるには、v1 を変える。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-cache-v1-${{ runner.os }}-${{ hashFiles('.zigversion', 'build.zig', 'build.zig.zon') }}
      - run: zig build test -Dslow=true --summary all
      - run: zig build test-scheme -Dslow=true
      - run: zig build test-wasm -Dslow=true

  dist:
    name: dist (ubuntu-latest)
    runs-on: ubuntu-latest
    # Why: 止まらないジョブは、GitHub の既定の上限(6時間)まで走り続ける。全ターゲットの
    # ビルドは、空のキャッシュから開発機で2分、他の作業と同時の4コアの環境で5分40秒
    # だった。標準ランナーの速さは未確認なので、20分は余裕を見た推測である。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit SHA, not a tag: tags can be moved.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # Why: slow ジョブと同じ形(docs/adr/0032-ci-zig-cache-saved-only-by-successful-runs.md)
      # で、キーだけを分ける。このキャッシュは、slow ジョブが作らない他のターゲットの
      # ビルドを含む。1つのキーに1種類の中身を持たせる。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-cache-dist-v1-${{ runner.os }}-${{ hashFiles('.zigversion', 'build.zig', 'build.zig.zon') }}
      # Why: package.py は Python 3 を要する。ubuntu-latest に入っていることは未確認なので、
      # 見つかった版をログに残す。
      - run: python3 --version
      - run: python3 -m unittest discover -s tools/release
      - run: zig build dist
      - run: zig-out/dist/x86_64-linux-musl/sucheme --version
      # Why: `grep -q` は一致すると読むのをやめるので、sucheme が最後の改行を書くときに
      # 読み手が居らず、負荷のもとで書き込みの失敗(EPIPE)になりうる。出力を最後まで読む。
      - run: printf '(define (fact n) (if (< n 2) 1 (* n (fact (- n 1)))))\n(fact 10)\n' | zig-out/dist/x86_64-linux-musl/sucheme | grep 3628800 > /dev/null
      - run: python3 tools/release/package.py
      - run: cd zig-out/release && sha256sum -c SHA256SUMS

  windows:
    name: tests (windows-latest)
    runs-on: windows-latest
    # Why: ci.yml の test ジョブと同じ時間の上限である(Windows は1分から5分で終わっていた)。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit SHA, not a tag: tags can be moved.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # Why: slow ジョブと同じ形(docs/adr/0032-ci-zig-cache-saved-only-by-successful-runs.md)。
      # キーは runner.os を含むので、Linux のキャッシュとは分かれる。ci.yml が Windows を
      # 走らせなくなったので、このキャッシュを作るのはこのジョブだけである。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-cache-v1-${{ runner.os }}-${{ hashFiles('.zigversion', 'build.zig', 'build.zig.zon') }}
      # Why: 以下の step は ci.yml の test ジョブと同じ並びである。Windows の検査は、
      # ci.yml が全 push で走らせていたものを、そのまま移した。
      - run: zig fmt --check .
      - run: zig build
      - run: zig build test --summary all --test-timeout 60s
      - run: zig build test-scheme
      - run: zig build wasm
      - run: zig build test-wasm
      - run: zig build check-docs
      - run: zig build check-extract
      - run: zig build check-report
      - run: zig build check-unicode
      - run: zig build check-examples
      - run: zig build test-conformance
