# Per-commit verification.
#
# AGENTS.md's verification command table is the source of truth for what runs
# here: every row whose "CIで実行" is 全コミット and whose "使えるようになる段階"
# is at or below the current stage. Each stage's plan adds the new rows.
#
# No conditionals and no "run the step if it exists": calling a step that does
# not exist fails, and tolerating that failure would hide a verification that
# silently stopped running.
#
# ファジング(`zig build test --fuzz=<N>`)は意図して入れていない。1回に数分の
# 時間とランナーの分数がかかるためである(AGENTS.md)。
# .github/workflows/fuzz.yml が、定期実行と手動起動で走らせる。
#
# The Zig version below is a copy; .zigversion is the source of truth and
# `zig build check-docs` verifies that the two agree.

name: CI

# A feature-branch push with an open PR would otherwise start two runs, one per
# event. Sharing a concurrency group does not fix that: cancellation is per
# group, so one of the two would simply be killed and the PR would show a
# cancelled check. Filtering the push trigger to main means a branch gets the
# pull_request run and main gets the push run, never both.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per workflow and ref so a new commit supersedes the previous run
  # on the same branch. github.ref distinguishes refs/heads/main from
  # refs/pull/<n>/merge, which is correct here because the two triggers no
  # longer overlap.
  #
  # Superseding means the older commit's run ends as cancelled and never turns
  # green. That is the intended trade for not paying for runs nobody will read:
  # the branch tip is what gets merged. "CI all green" is judged on the head
  # commit of the PR, not on every intermediate commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Why: 止まらないジョブは、GitHub の既定の上限(6時間)まで走り続ける。直近の
    # 実行は、1分から4分で終わっていた(キャッシュが空の回を含む)。
    # 20分は実績の約5倍で、止まらないジョブを失敗として終わらせる。
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Why: Windows のテストは full.yml に移した。private リポジトリでは実行分数が月の
        # 枠に計上され、見積りでは Windows のジョブが合計の半分を超えていたので、全 push
        # の検査から外した。見積りは Windows を Linux の2倍で数えた(倍率は未確認。
        # docs/plans/0015-ci-minutes-reduction.md、docs/adr/0036)。Windows は PR を
        # ready にするときと手動で full.yml が走らせる。
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Pinned to a commit SHA, not a tag: tags can be moved.
      # dependabot's github-actions ecosystem keeps this current.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      # Why: Zig のキャッシュは、setup-zig ではなくこの step が持つ(上の
      # `use-cache: false`)。setup-zig は、結果にかかわらず毎回の実行の最後に、新しい
      # キーでキャッシュを保存し、復元は検査せずに最新の項目を取る。キャッシュを
      # 展開している途中で中断された実行が、展開しかけのディレクトリを保存し、
      # 以後の実行がそれを復元して失敗し、失敗した実行がまた保存した
      # (docs/adr/0032-ci-zig-cache-saved-only-by-successful-runs.md)。
      #
      # actions/cache は、ジョブが成功し、かつこのキーが無かったときだけ保存する。
      # キーには、キャッシュの中身を決めるものを入れるので、項目の数は少ないままである。
      # キャッシュを捨てるには、v1 を変える。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache
          key: zig-cache-v1-${{ runner.os }}-${{ hashFiles('.zigversion', 'build.zig', 'build.zig.zon') }}
      - run: zig fmt --check .
      - run: zig build
      # Why: --test-timeout は、止まらないテストを、テスト名つきの失敗として終わ
      # らせる。付けないと、そのテストはジョブの上限まで待たせる。最も遅いテストは、
      # 開発機の Debug ビルドで2秒から3秒だった。60秒は、遅いランナーに対する余裕
      # である。値の綴りは tools/check-docs の allowed_run_suffixes が固定している。
      - run: zig build test --summary all --test-timeout 60s
      - run: zig build test-scheme
      - run: zig build wasm
      - run: zig build test-wasm
      - run: zig build check-docs
      - run: zig build check-extract
      - run: zig build check-report
      - run: zig build check-unicode
