# Dependabot configuration.
#
# SECURITY: the `cooldown` block below is a supply-chain-attack defense.
# It delays update PRs until a new release has been public for a few days,
# giving the community time to detect malicious releases.
# Do NOT remove or disable it without the user's explicit approval
# (see the Security section in AGENTS.md).
#
# Only the github-actions ecosystem is configured. sucheme-zig has no package
# manager: Zig dependencies would live in build.zig.zon (currently empty, and
# dependabot has no Zig ecosystem), and the Web UI is deliberately
# dependency-free (see docs/adr/0009-wasm-freestanding-and-zero-dependency-web-ui.md).
# Add an ecosystem here only when the repository actually gains one.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 8
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    assignees:
      - "suchi"
    labels:
      - "dependencies"
    groups:
      non-majors:
        update-types:
          - "minor"
          - "patch"
