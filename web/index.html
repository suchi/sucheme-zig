<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>sucheme</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <h1>sucheme <small id="version" aria-label="Version">Loading…</small></h1>

    <form id="form" autocomplete="off">
      <div class="samples">
        <label for="samples">Samples</label>
        <select id="samples">
          <option value="">Choose a sample</option>
        </select>
      </div>

      <label for="source">Input (Scheme expressions)</label>
      <textarea id="source" name="source" rows="8" spellcheck="false" autocapitalize="off" autocorrect="off">(define (fact n) (if (= n 0) 1 (* n (fact (- n 1)))))
(fact 10)</textarea>

      <div class="actions">
        <button type="submit" id="run" class="primary" disabled>Run</button>
        <button type="button" id="stop" class="danger" disabled>Stop</button>
        <button type="button" id="reset" disabled>Reset</button>
        <span id="elapsed" class="hint" role="timer" aria-label="Elapsed time" hidden></span>
        <span class="hint">Ctrl+Enter (Cmd+Enter on a Mac) also runs the input. Esc stops a running evaluation.</span>
      </div>
      <p id="stop-warning" class="hint stop-warning" hidden></p>

      <div class="share">
        <button type="button" id="share">Create share link</button>
        <input type="text" id="share-url" readonly aria-label="Share link" placeholder="The share link appears here">
        <span id="share-status" class="hint" role="status"></span>
      </div>
    </form>

    <h2 id="output-label">Output</h2>
    <pre id="output" aria-labelledby="output-label" aria-live="polite" data-status="idle">Loading WebAssembly…</pre>
    <section id="error" class="error-panel" role="alert" hidden>
      <h2 id="error-title"></h2>
      <pre id="error-message"></pre>
      <p id="error-hint" class="hint"></p>
    </section>
  </main>

  <script>
    // file:// では、モジュールスクリプトも Worker も WASM も取得できない。
    // app.js が動かない場合でも案内が出るように、読み込みに頼らない classic script で書く。
    if (location.protocol === "file:") {
      var out = document.getElementById("output");
      out.textContent = "Open this page through a local server: node web/serve.mjs";
      out.setAttribute("data-status", "error");
      document.getElementById("version").textContent = "Not connected";
    }
  </script>
  <script type="module" src="./app.js"></script>
</body>
</html>
